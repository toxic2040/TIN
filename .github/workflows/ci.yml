name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dev dependencies
        run: pip install -e .[dev]
      - name: Ruff lint
        run: ruff check tin tests
      - name: mypy static typing
        run: mypy tin --no-error-summary
      - name: Run tests with coverage
        run: pytest --cov=tin --cov-report=term-missing --cov-fail-under=70 -q
      - name: Check test collection floor
        run: |
          python - <<'PY'
          import subprocess
          import sys

          proc = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q", "-p", "no:cacheprovider"],
              check=True,
              capture_output=True,
              text=True,
          )
          count = sum(1 for line in proc.stdout.splitlines() if line.startswith("tests/"))
          if count < 89:
              raise SystemExit(f"expected at least 89 collected tests, got {count}")
          print(f"collected {count} tests")
          PY

  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Set up locked Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev-lock.txt
          pip install -e . --no-deps
      - name: Verify locked NumPy major
        run: |
          python - <<'PY'
          import numpy as np

          major = int(np.__version__.split(".", 1)[0])
          if major < 2:
              raise SystemExit(f"expected NumPy 2.x from lock file, got {np.__version__}")
          print(f"NumPy {np.__version__}")
          PY
      - name: Run determinism smoke test
        run: pytest tests/test_repro_determinism.py -q
      - name: Compare committed v0.3.8 baseline
        run: python runs/verify_repro_v0_3_8_baseline.py --coverage-workers 2
