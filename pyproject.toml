[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tin"
version = "0.9.5"
description = "TIN — delay-tolerant network simulation and analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "J. Councilman", email = "jcouncilman2040@gmail.com"},
]
keywords = [
    "dtn",
    "delay-tolerant-networking",
    "percolation",
    "space-networking",
    "simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: System :: Networking",
]
dependencies = [
    "numpy>=2.4.4",
]

[project.urls]
Repository = "https://github.com/toxic2040/TIN"
Issues = "https://github.com/toxic2040/TIN/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=1.20",
    "scipy>=1.17.1",
]
viz = [
    "plotly>=5.0",
    "matplotlib>=3.10",
]
spice = [
    "spiceypy>=8.1",
]
cr3bp = [
    "scipy>=1.17.1",
]

[tool.setuptools.packages.find]
# Only the public tin package is exported.
include = ["tin*"]

[tool.setuptools.package-data]
tin = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E402",   # module-level imports — runs/ scripts define constants before imports
    "E501",   # line too long — handled by formatter
    "E741",   # ambiguous variable names (l, I, n) — domain conventions
    "E731",   # lambda assignment — acceptable in runners
    "F841",   # unused variables — often intentional destructuring
    "UP031",  # printf-style formatting — acceptable in legacy code
]

[tool.ruff.lint.per-file-ignores]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "spiceypy"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "scipy.special",
    "scienceplots",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["tin"]
omit = [
    "tin/scenarios/*",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__",
    "def _run_tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "fast: synthetic/formula tests, no contact generation",
    "integration: real contact generation and oracle sweep",
    "compendium: guards a formal compendium result",
    "boundary: verdict boundary conditions and simultaneous fail/unevaluated scenarios",
]
